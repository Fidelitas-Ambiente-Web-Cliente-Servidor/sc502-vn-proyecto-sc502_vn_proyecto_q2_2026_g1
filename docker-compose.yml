services:
  php-apache-demo:
    image: php:8.2-apache
    container_name: edulecto-php
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql-demo
    command: >
      bash -c "docker-php-ext-install pdo_mysql mysqli && apache2-foreground"

  mysql-demo:
    image: mysql:8.0
    container_name: edulecto-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: edulecto
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

  phpmyadmin-demo:
    image: phpmyadmin/phpmyadmin
    container_name: edulecto-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql-demo
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8083:80"
    depends_on:
      - mysql-demo

volumes:
  db_data:
